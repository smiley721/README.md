<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Enquiry - Outdoor Warehouse</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <header>
        <h1>Outdoor Warehouse Portal</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="products.html">Our Equipment</a></li>
            <li><a href="enquiry.html">Product Enquiry</a></li>
            <li><a href="contact.html">Find a Store</a></li>
        </ul>
    </nav>
    <main>
        <h2>Gear Enquiry Form</h2>
        <p>Fill out your details below to check stock or request a quote for bulk gear orders.</p>
        
        <!-- Interactive Form Elements -->
        <form>
            <p>
                <label>Your Full Name:</label><br>
                <input type="text" name="name" required placeholder="Enter name">
            </p>
            <p>
                <label>Email Address:</label><br>
                <input type="email" name="email" required placeholder="name@example.com">
            </p>
            <p>
                <label>Gear Category:</label><br>
                <select name="category">
                    <option>Tents & Shelters</option>
                    <option>Camping Furniture</option>
                    <option>Off-Road Gear</option>
                    <option>Camp Kitchen</option>
                </select>
            </p>
            <p>
                <label>Your Message:</label><br>
                <textarea name="message" rows="4" required placeholder="List items here..."></textarea>
            </p>
            <p>
                <button type="submit">Submit Request</button>
            </p>
        </form>
    </main>
    <footer>
       <p>&COPY; Outdoor website</p>
    </footer>
</body>
</html>
